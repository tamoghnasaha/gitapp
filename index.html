<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Secret Surprise... 🎁</title>
  <style>
    :root {
      --primary-color: #6C5CE7;
      --accent-color: #FF7675;
      --text-dark: #2D3436;
      --bg-gradient: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      padding: 20px;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 35px 25px;
      max-width: 480px;
      width: 100%;
      min-height: 460px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      position: relative; /* Keeps button strictly inside */
      overflow: hidden; /* Clips anything trying to overflow */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .icon {
      font-size: 56px;
      margin-bottom: 10px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    h1 {
      color: var(--text-dark);
      font-size: 24px;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #636E72;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* Countdown Display Styles */
    .timer-container {
      background: #F1F2F6;
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 25px;
      width: 100%;
    }

    .timer-title {
      font-size: 11px;
      color: #8395A7;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .countdown {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary-color);
    }

    .label {
      font-size: 10px;
      color: #576574;
      text-transform: uppercase;
    }

    .separator {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
      margin-top: -12px;
    }

    .btn-container {
      width: 100%;
      height: 70px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .unlock-btn {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(108, 92, 231, 0.3);
      white-space: nowrap;
      user-select: none;
      z-index: 10;
      transition: none;
    }

    .message-box {
      display: none;
      margin-top: 15px;
      padding: 25px;
      border-radius: 16px;
      background: #F8F9FA;
      border: 2px dashed var(--primary-color);
      animation: fadeIn 0.8s ease forwards;
      width: 100%;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-box h2 {
      color: var(--primary-color);
      font-size: 28px;
      margin: 0;
    }

    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <div class="card" id="card">
    <div class="icon" id="icon">🎁</div>
    <h1>A Secret Message For You</h1>
    <p class="subtitle" id="subtext">Catch the button below to reveal your surprise!</p>

    <!-- Countdown Timer -->
    <div class="timer-container" id="timerContainer">
      <div class="timer-title">Unlocks In</div>
      <div class="countdown">
        <div class="time-block">
          <span class="number" id="hours">00</span>
          <span class="label">Hours</span>
        </div>
        <span class="separator">:</span>
        <div class="time-block">
          <span class="number" id="minutes">00</span>
          <span class="label">Mins</span>
        </div>
        <span class="separator">:</span>
        <div class="time-block">
          <span class="number" id="seconds">00</span>
          <span class="label">Secs</span>
        </div>
      </div>
    </div>

    <div class="btn-container" id="btnContainer">
      <button id="revealBtn" class="unlock-btn">
        ✨ Click Me For Surprise ✨
      </button>
    </div>

    <div class="message-box" id="messageBox">
       <h2>🎉 Happy Birthday to you Gautumi! 🥳</h2>
	  <h4> Give treat after Sravan ends & don't put POSH on me </h4>
    </div>
  </div>

  <script>
    // Target Unlocking Timestamp: August 11, 2026, 23:59:59.000 (Local Time)
    const targetDate = new Date("2026-08-11T23:59:59.000").getTime();

    const card = document.getElementById('card');
    const revealBtn = document.getElementById('revealBtn');
    const btnContainer = document.getElementById('btnContainer');
    const timerContainer = document.getElementById('timerContainer');
    const messageBox = document.getElementById('messageBox');
    const icon = document.getElementById('icon');
    const subtext = document.getElementById('subtext');

    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    let isUnlocked = false;

    // Countdown Timer Logic
    function updateTimer() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        isUnlocked = true;
        hoursEl.innerText = "00";
        minutesEl.innerText = "00";
        secondsEl.innerText = "00";

        revealBtn.style.position = 'static';
        subtext.innerText = "You caught it! Click below to open your message.";
        return;
      }

      const totalHours = Math.floor(difference / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      hoursEl.innerText = totalHours < 10 ? '0' + totalHours : totalHours;
      minutesEl.innerText = minutes < 10 ? '0' + minutes : minutes;
      secondsEl.innerText = seconds < 10 ? '0' + seconds : seconds;
    }

    const timerInterval = setInterval(updateTimer, 1000);
    updateTimer();

    // Dodging Movement strictly confined inside the white card
    function moveButtonInsideCard() {
      if (isUnlocked) return;

      const cardRect = card.getBoundingClientRect();
      const btnRect = revealBtn.getBoundingClientRect();

      const padding = 15; // Inset padding inside card boundaries
      const minX = padding;
      const maxX = cardRect.width - btnRect.width - padding;

      const minY = padding;
      const maxY = cardRect.height - btnRect.height - padding;

      const newX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
      const newY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

      revealBtn.style.position = 'absolute';
      revealBtn.style.left = `${newX}px`;
      revealBtn.style.top = `${newY}px`;
    }

    // Trigger dodging when mouse gets near
    window.addEventListener('mousemove', (e) => {
      if (isUnlocked) return;

      const btnRect = revealBtn.getBoundingClientRect();
      const distanceX = Math.abs(e.clientX - (btnRect.left + btnRect.width / 2));
      const distanceY = Math.abs(e.clientY - (btnRect.top + btnRect.height / 2));

      if (distanceX < (btnRect.width / 2 + 40) && distanceY < (btnRect.height / 2 + 40)) {
        moveButtonInsideCard();
      }
    });

    // Touch Handling for mobile
    revealBtn.addEventListener('touchstart', (e) => {
      if (!isUnlocked) {
        e.preventDefault();
        moveButtonInsideCard();
      }
    });

    revealBtn.addEventListener('click', () => {
      if (!isUnlocked) {
        moveButtonInsideCard();
        return;
      }

      btnContainer.style.display = 'none';
      timerContainer.style.display = 'none';
      messageBox.style.display = 'block';
      icon.innerText = "🎂";
      subtext.innerText = "Have a marvelous day!";
      launchConfetti();
    });

    // Confetti Visual Effect
    function launchConfetti() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#6C5CE7', '#FF7675', '#00CEC9', '#FFD32A', '#A29BFE'];

      for (let i = 0; i < 100; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: Math.random() * 4 + 2,
          angle: Math.random() * 360
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();

          p.y += p.speed;
          p.angle += 0.05;

          if (p.y > canvas.height) p.y = -20;
        });
        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>
</html>
